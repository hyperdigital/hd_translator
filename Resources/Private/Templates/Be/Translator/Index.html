<html
		xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
		xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
		xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
		data-namespace-typo3-fluid="true">
<f:layout name="Module" />

<f:section name="Content">
<div class="hd-translator">
	<f:if condition="{emptyStorage}">
		<f:then>
			<f:render section="setupStorage" />
		</f:then>
		<f:else>
			<f:render partial="Module/Header" arguments="{
				title: '{f:translate(key: \'index.headline\')}',
				description: '{f:translate(key: \'index.categories.description\')}',
				pageData: pageData
			}" />

			<f:if condition="{categories}">
				<f:then>
					<div class="hd-translator-toolbar">
						<div class="hd-translator-toolbar-search">
							<f:render partial="Search" arguments="{_all}" />
						</div>
						<f:if condition="{enabledSync}">
							<div class="hd-translator-toolbar-actions">
								<f:link.action action="syncLocallangs" class="btn btn-default">
									<core:icon identifier="actions-synchronize" size="small" />
									<f:translate key="index.synchronizeLocalizedFiles" />
								</f:link.action>
							</div>
						</f:if>
					</div>

					<div class="table-fit">
						<table class="table table-striped table-hover">
							<thead>
								<tr>
									<th><f:translate key="index.categories.headline" /></th>
									<th><f:translate key="list.file" /></th>
								</tr>
							</thead>
							<tbody>
								<f:for each="{categories}" as="languages" key="category">
									<tr>
										<td class="hd-translator-nowrap">
											<f:link.action action="list" arguments="{category: category}">
												<core:icon identifier="actions-translate" size="small" />
												<strong>{category}</strong>
											</f:link.action>
										</td>
										<td class="hd-translator-source-cell">
											<f:if condition="{languages}">
												<f:for each="{languages}" as="language" iteration="i">{language.label}<f:if condition="!{i.isLast}">, </f:if></f:for>
											</f:if>
										</td>
									</tr>
								</f:for>
							</tbody>
						</table>
					</div>
				</f:then>
				<f:else>
					<f:render partial="Module/Callout" arguments="{
						state: 'info',
						title: '{f:translate(key: \'index.noTranslations.headline\')}',
						message: '{f:translate(key: \'index.noTranslations.description\')}'
					}" />

					<f:if condition="{enabledSync}">
						<p>
							<f:link.action action="syncLocallangs" class="btn btn-primary">
								<core:icon identifier="actions-synchronize" size="small" />
								<f:translate key="index.synchronizeLocalizedFiles" />
							</f:link.action>
						</p>
					</f:if>

					<div class="hd-translator-fieldset">
						<div class="hd-translator-fieldset-legend">ext_localconf.php</div>
<pre><code>$GLOBALS['TYPO3_CONF_VARS']['translator']['news'] = [
    'label' =&gt; 'News',
    'path' =&gt; 'EXT:news/Resources/Private/Language/locallang.xlf',
    'category' =&gt; 'Category1',
    'languages' =&gt; ['de', 'default'],
];</code></pre>
					</div>
				</f:else>
			</f:if>
		</f:else>
	</f:if>
</div>
</f:section>

<f:section name="setupStorage">
	<f:render partial="Module/Header" arguments="{
		title: '{f:translate(key: \'index.missingStorage.headline\')}'
	}" />

	<f:render partial="Module/Callout" arguments="{
		state: 'warning',
		icon: 'actions-exclamation-triangle',
		message: '{f:translate(key: \'index.missingStorage.description\')}'
	}" />

	<p>
		<f:be.link route="tools_toolssettings" class="btn btn-primary">
			<core:icon identifier="actions-arrow-right" size="small" />
			<f:translate key="index.missingStorage.goToSettings" />
		</f:be.link>
	</p>

	<div class="hd-translator-fieldset">
		<f:image src="EXT:hd_translator/Resources/Public/Images/SetupStoragePath.png" maxHeight="350" alt="" />
	</div>
</f:section>
</html>
