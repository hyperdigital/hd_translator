services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Hyperdigital\HdTranslator\:
    resource: '../Classes/*'

  # Carries the bookkeeping of a single export or import run, so every caller has to get its own
  # instance. As a shared service two runs in the same request would add up into each other.
  Hyperdigital\HdTranslator\Services\DatabaseEntriesService:
    shared: false

  Hyperdigital\HdTranslator\Hooks\DocHeaderButtonsHook:
    tags:
      - name: event.listener
        identifier: 'hd-translator/hooks/modify-button-bar'
        method: 'modifyButtonBarColumns'
      - name: event.listener
        identifier: 'hd-translator/recordlist/my-event-listener'
        method: 'modifyRecordActions'

  Hyperdigital\HdTranslator\ContextMenu\ExportItemProvider:
    tags:
      - name: backend.contextmenu.itemprovider

